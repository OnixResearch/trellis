project:
  name: verified-logic
  description: Verified logic library — reusable building blocks with machine-checked proofs via Verus
  language: rust
  schema: spec-driven

domains:
  - arithmetic
  - collections
  - bounds
  - option-result

context: |
  Rust library crate verified with Verus (SMT-backed formal verification).
  Tracey links markdown requirements to code annotations.
  Combined pattern (exec fn with ensures) preferred over split pattern.
  All public API must have verified contracts — no unverified public fn.

rules:
  proposal:
    - Keep proposals focused on what the library provides to downstream crates
  tasks:
    - Each task must end with both `verus` passing and `tracey query uncovered` clean
